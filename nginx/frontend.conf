server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # This container serves only the React build. Do not let SPA fallback make
    # requests for server-side scripts look like successful application pages.
    location ~* \.(?:php[0-9]?|phtml|phar)$ {
        return 404;
    }

    location ^~ /cgi-bin/ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
