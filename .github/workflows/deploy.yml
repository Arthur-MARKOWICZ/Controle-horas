name: Deploy TypeScript stack

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master'))
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.names.outputs.backend }}
      frontend: ${{ steps.names.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        shell: bash
        run: |
          root=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=${root}/backend:${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend=${root}/frontend:${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.names.outputs.backend }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ steps.names.outputs.frontend }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: Configure SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.OCI_VM_KEY }}
          SSH_HOST: ${{ secrets.OCI_VM_HOST }}
          SSH_USER: ${{ secrets.OCI_VM_USER }}
          SSH_PORT: ${{ secrets.OCI_VM_PORT || '22' }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host controle-horas
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/oci_key
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config
          ssh controle-horas true

      - name: Upload compose and environment
        shell: bash
        env:
          BACKEND_IMAGE: ${{ needs.publish.outputs.backend }}
          FRONTEND_IMAGE: ${{ needs.publish.outputs.frontend }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'controle_horas' }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          env_file=$(mktemp)
          trap 'rm -f "$env_file"' EXIT
          for name in BACKEND_IMAGE FRONTEND_IMAGE DATABASE_URL DB_USERNAME DB_PASSWORD JWT_ACCESS_SECRET JWT_REFRESH_SECRET; do
            test -n "${!name}"
          done
          write_env() {
            local key="$1" value="$2" escaped
            escaped=${value//\\/\\\\}
            escaped=${escaped//\'/\\\'}
            printf "%s='%s'\n" "$key" "$escaped"
          }
          {
            write_env BACKEND_IMAGE "$BACKEND_IMAGE"
            write_env FRONTEND_IMAGE "$FRONTEND_IMAGE"
            write_env DATABASE_URL "$DATABASE_URL"
            write_env DB_USERNAME "$DB_USERNAME"
            write_env DB_PASSWORD "$DB_PASSWORD"
            write_env POSTGRES_DB "$POSTGRES_DB"
            write_env JWT_ACCESS_SECRET "$JWT_ACCESS_SECRET"
            write_env JWT_REFRESH_SECRET "$JWT_REFRESH_SECRET"
            write_env COOKIE_SECURE false
          } > "$env_file"
          ssh controle-horas 'mkdir -p ~/controle-horas'
          scp docker-compose.prod.yml controle-horas:~/controle-horas/
          scp "$env_file" controle-horas:~/controle-horas/.env
          ssh controle-horas '
            set -eu
            cd ~/controle-horas
            docker compose -f docker-compose.prod.yml config --quiet
            services=$(docker compose -f docker-compose.prod.yml config --services)
            for required in postgres backend nginx; do
              printf "%s\n" "$services" | grep -qx "$required" || {
                printf "Uploaded Compose is missing required service: %s\n" "$required" >&2
                exit 1
              }
            done
          '

      - name: Start PostgreSQL and create verified backup
        shell: bash
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'controle_horas' }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
        run: |
          set -euo pipefail
          if test -z "$BACKUP_PASSPHRASE"; then
            printf "Required production secret is missing: BACKUP_PASSPHRASE\n" >&2
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y postgresql-client
          printf '%s' "$GHCR_TOKEN" | ssh controle-horas "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"
          ssh controle-horas 'cd ~/controle-horas && chmod 600 .env && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d postgres'
          for attempt in $(seq 1 30); do
            ssh controle-horas 'cd ~/controle-horas && docker compose -f docker-compose.prod.yml exec -T postgres pg_isready' && break
            test "$attempt" -lt 30
            sleep 2
          done
          backup="backup-$(date -u +%Y%m%dT%H%M%SZ).dump"
          ssh controle-horas "cd ~/controle-horas && docker compose -f docker-compose.prod.yml exec -T postgres pg_dump -U '$DB_USERNAME' -d '$POSTGRES_DB' -Fc" > "$backup"
          pg_restore --list "$backup" > /dev/null
          openssl enc -aes-256-cbc -salt -pbkdf2 -in "$backup" -out "${backup}.enc" -pass env:BACKUP_PASSPHRASE
          rm -f "$backup"
          echo "BACKUP_FILE=${backup}.enc" >> "$GITHUB_ENV"

      - name: Store encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 14
          if-no-files-found: error

      - name: Run migrations and deploy
        shell: bash
        run: |
          set -euo pipefail
          ssh controle-horas 'cd ~/controle-horas && docker compose -f docker-compose.prod.yml run --rm backend npm run migrate'
          ssh controle-horas 'cd ~/controle-horas && docker compose -f docker-compose.prod.yml up -d --remove-orphans'
          for attempt in $(seq 1 24); do
            if ssh controle-horas 'curl --fail --silent http://127.0.0.1/ready >/dev/null'; then exit 0; fi
            test "$attempt" -lt 24
            sleep 5
          done

      - name: Diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          ssh controle-horas '
            cd ~/controle-horas || exit 0
            test -f docker-compose.prod.yml || exit 0
            services=$(docker compose -f docker-compose.prod.yml config --services 2>/dev/null)
            docker compose -f docker-compose.prod.yml ps -a
            if test -n "$services"; then
              docker compose -f docker-compose.prod.yml logs --tail=200 $services
            fi
            exit 0
          '
          exit 0
