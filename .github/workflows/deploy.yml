name: Deploy application to Oracle Cloud VM

on:
  push:
    branches: [main, master]
    paths:
      - 'back-end/**'
      - 'frontend/**'
      - 'Dockerfile.backend'
      - 'Dockerfile.frontend'
      - 'nginx/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_REGISTRY: ghcr.io

jobs:
  build-and-push-images:
    name: Build and push application images
    runs-on: ubuntu-latest
    outputs:
      backend-image-name: ${{ steps.images.outputs.backend-name }}
      frontend-image-name: ${{ steps.images.outputs.frontend-name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define image names
        id: images
        run: |
          BACKEND_IMAGE_NAME="ghcr.io/${{ github.repository }}/backend"
          FRONTEND_IMAGE_NAME="ghcr.io/${{ github.repository }}/frontend"
          echo "backend-name=$(echo "$BACKEND_IMAGE_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "frontend-name=$(echo "$FRONTEND_IMAGE_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ steps.images.outputs.backend-name }}:latest
            ${{ steps.images.outputs.backend-name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL || format('http://{0}:8080', secrets.OCI_VM_HOST) }}
          tags: |
            ${{ steps.images.outputs.frontend-name }}:latest
            ${{ steps.images.outputs.frontend-name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-oracle-vm:
    name: Deploy application to Oracle Cloud VM
    needs: build-and-push-images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' '${{ secrets.OCI_VM_KEY }}' > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key
          ssh-keyscan -p "${{ secrets.OCI_VM_PORT || 22 }}" "${{ secrets.OCI_VM_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Copy deployment configuration
        run: |
          ssh -i ~/.ssh/oci_key -p "${{ secrets.OCI_VM_PORT || 22 }}" -o ConnectTimeout=30 \
            "${{ secrets.OCI_VM_USER }}@${{ secrets.OCI_VM_HOST }}" "mkdir -p ~/controle-horas"
          scp -i ~/.ssh/oci_key -P "${{ secrets.OCI_VM_PORT || 22 }}" -o ConnectTimeout=30 \
            docker-compose.prod.yml \
            "${{ secrets.OCI_VM_USER }}@${{ secrets.OCI_VM_HOST }}:~/controle-horas/docker-compose.prod.yml"

      - name: Deploy application
        timeout-minutes: 20
        env:
          BACKEND_IMAGE: ${{ needs.build-and-push-images.outputs.backend-image-name }}:${{ github.sha }}
          FRONTEND_IMAGE: ${{ needs.build-and-push-images.outputs.frontend-image-name }}:${{ github.sha }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'controle_horas' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION_MS: ${{ secrets.JWT_EXPIRATION_MS || '3600000' }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS || 'http://localhost:5173,https://controle-horas.arthurlopes25072005.workers.dev' }}
          FRONTEND_PORT: ${{ secrets.FRONTEND_PORT || '80' }}
          BACKEND_PORT: ${{ secrets.BACKEND_PORT || '8080' }}
          HSTS_ENABLED: 'true'
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCI_VM_HOST: ${{ secrets.OCI_VM_HOST }}
          OCI_VM_USER: ${{ secrets.OCI_VM_USER }}
          OCI_VM_PORT: ${{ secrets.OCI_VM_PORT || 22 }}
        run: |
          ssh -i ~/.ssh/oci_key -p "$OCI_VM_PORT" -o ConnectTimeout=30 \
            "$OCI_VM_USER@$OCI_VM_HOST" "bash -s" <<EOF
          set -eu
          cd ~/controle-horas
          umask 077
          cat > .env <<ENVEOF
          BACKEND_IMAGE=${BACKEND_IMAGE}
          FRONTEND_IMAGE=${FRONTEND_IMAGE}
          DB_USERNAME=${DB_USERNAME}
          DB_PASSWORD=${DB_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          JWT_SECRET=${JWT_SECRET}
          JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS}
          CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
          FRONTEND_PORT=${FRONTEND_PORT}
          BACKEND_PORT=${BACKEND_PORT}
          HSTS_ENABLED=${HSTS_ENABLED}
          ENVEOF
          chmod 600 .env

          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          BACKEND_CONTAINER=\$(docker compose -f docker-compose.prod.yml ps -q backend)
          FRONTEND_CONTAINER=\$(docker compose -f docker-compose.prod.yml ps -q frontend)
          test -n "\$BACKEND_CONTAINER"
          test -n "\$FRONTEND_CONTAINER"
          for attempt in \$(seq 1 36); do
            BACKEND_STATUS=\$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "\$BACKEND_CONTAINER")
            FRONTEND_STATUS=\$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "\$FRONTEND_CONTAINER")
            [ "\$BACKEND_STATUS" = healthy ] && [ "\$FRONTEND_STATUS" = healthy ] && exit 0
            if [ "\$BACKEND_STATUS" = unhealthy ] || [ "\$FRONTEND_STATUS" = unhealthy ]; then
              break
            fi
            sleep 5
          done

          docker compose -f docker-compose.prod.yml logs --tail=100 backend frontend
          exit 1
          EOF

      - name: Clean up SSH credentials
        if: always()
        run: rm -f ~/.ssh/oci_key
