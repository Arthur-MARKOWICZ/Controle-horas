name: controle_horas_local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: controle_horas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["controle_horas_postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d controle_horas"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["npm", "run", "migrate"]
    restart: "no"
    environment: &backend-environment
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/controle_horas
      DB_POOL_MAX: 5
      JWT_ACCESS_SECRET: local-access-secret-with-at-least-32-bytes-change-me
      JWT_REFRESH_SECRET: local-refresh-secret-with-at-least-32-bytes-change-me
      COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      TIME_ZONE: America/Sao_Paulo
      PORT: 8080
      NODE_ENV: development
      OPENAPI_ENABLED: "true"
    depends_on:
      postgres: { condition: service_healthy }

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment: *backend-environment
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

  nginx:
    build: { context: ., dockerfile: Dockerfile.frontend }
    ports: ["8080:80"]
    depends_on:
      backend: { condition: service_healthy }

  mobile:
    profiles: ["native"]
    build: { context: ./mobile, dockerfile: Dockerfile }
    environment:
      EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:8080
    ports: ["8081:8081"]
    volumes:
      - ./mobile:/app
      - controle_horas_mobile_node_modules:/app/node_modules
    command: npx expo start --lan --port 8081
    stdin_open: true
    tty: true

volumes:
  controle_horas_postgres_data:
  controle_horas_mobile_node_modules:
