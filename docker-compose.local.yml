name: controle_horas_local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: controle_horas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - controle_horas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d controle_horas"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/controle_horas
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: local-development-secret-change-before-production-2026
      JWT_EXPIRATION_MS: 3600000
      CORS_ALLOWED_ORIGINS: http://localhost:8081,http://127.0.0.1:8081
      HSTS_ENABLED: "false"
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  mobile:
    profiles: ["native"]
    build:
      context: ./mobile
      dockerfile: Dockerfile
    environment:
      EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:8080
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "8081:8081"
    volumes:
      - ./mobile:/app
      - controle_horas_mobile_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    command: npx expo start --lan --port 8081
    stdin_open: true
    tty: true

  web:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    environment:
      EXPO_PUBLIC_API_BASE_URL: http://localhost:8080
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "8081:8081"
    volumes:
      - ./mobile:/app
      - controle_horas_mobile_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    command: npx expo start --web --port 8081
    stdin_open: true
    tty: true

volumes:
  controle_horas_postgres_data:
  controle_horas_mobile_node_modules:
