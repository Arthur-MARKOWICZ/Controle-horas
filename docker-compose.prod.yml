name: controle_horas_prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-256m}
    shm_size: 64mb
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-20}", "-c", "shared_buffers=64MB", "-c", "work_mem=2MB"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-controle_horas}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - controle_horas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    mem_limit: ${BACKEND_MEMORY_LIMIT:-256m}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DB_POOL_MAX: ${DB_POOL_MAX:-5}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-2592000}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TIME_ZONE: America/Sao_Paulo
      PORT: 8080
      NODE_ENV: production
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-false}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    logging: *default-logging

  nginx:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    restart: unless-stopped
    mem_limit: ${NGINX_MEMORY_LIMIT:-32m}
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

volumes:
  controle_horas_postgres_data:
