name: controle_horas_prod

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/controle_horas_backend:latest}
    container_name: controle_horas_backend
    restart: unless-stopped
    environment:
      # Use the Neon pooled or direct JDBC URL with sslmode=require.
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      HSTS_ENABLED: ${HSTS_ENABLED:-true}
      SERVER_PORT: 8080
    ports:
      # Cloudflare Worker forwards /api requests to this HTTP endpoint.
      - "${BACKEND_PORT:-80}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 120s
