name: controle_horas_load

services:
  postgres:
    image: postgres:16-alpine
    mem_limit: 384m
    cpus: 0.50
    command: ["postgres", "-c", "max_connections=20", "-c", "shared_buffers=64MB", "-c", "work_mem=2MB"]
    environment:
      POSTGRES_DB: controle_horas_load
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: ["controle_horas_load_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d controle_horas_load"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: .., dockerfile: backend/Dockerfile }
    command: ["npm", "run", "migrate"]
    restart: "no"
    environment: &backend_environment
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/controle_horas_load
      DB_POOL_MAX: 5
      JWT_ACCESS_SECRET: load-access-secret-with-at-least-32-bytes
      JWT_REFRESH_SECRET: load-refresh-secret-with-at-least-32-bytes
      JWT_ACCESS_TTL_SECONDS: 900
      JWT_REFRESH_TTL_SECONDS: 2592000
      BCRYPT_ROUNDS: 10
      COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:18080
      TIME_ZONE: America/Sao_Paulo
      PORT: 8080
      NODE_ENV: production
      OPENAPI_ENABLED: "false"
      LOG_LEVEL: warn
    depends_on:
      postgres: { condition: service_healthy }

  backend:
    build: { context: .., dockerfile: backend/Dockerfile }
    mem_limit: 512m
    cpus: 0.45
    environment: *backend_environment
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

  nginx:
    build: { context: .., dockerfile: Dockerfile.frontend }
    mem_limit: 64m
    cpus: 0.05
    ports: ["127.0.0.1:${LOAD_HTTP_PORT:-18080}:80"]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  controle_horas_load_postgres:
